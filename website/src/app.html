<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>3 Terres</title>
    <link rel="icon" type="image/webp" href="%sveltekit.assets%/logo_favikon.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%

    <style>
      #site-intro-loader {
        --bg: #000000;
        --glow-white: rgba(255, 255, 255, 0.88);
        --glow-silver: rgba(228, 233, 255, 0.38);
        --glow-cool: rgba(130, 160, 255, 0.18);
        --glow-deep: rgba(25, 38, 78, 0.16);

        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        opacity: 1;
        transition: opacity 0.65s cubic-bezier(0.22, 0.61, 0.36, 1);
        pointer-events: none;
        overflow: hidden;
      }

      #site-intro-loader.is-hidden {
        opacity: 0;
      }

      #site-intro-loader svg {
        position: relative;
        z-index: 1;
        width: min(360px, 54vw);
        height: auto;
        overflow: visible;
        transform: translateZ(0);
        backface-visibility: hidden;
        isolation: isolate;
      }

      #site-intro-loader .intro-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: min(460px, 68vw);
        aspect-ratio: 1;
        transform: translate3d(0, 0, 0);
        will-change: transform, opacity, filter;
      }

      #site-intro-loader .intro-mark-glow {
        position: absolute;
        inset: 10%;
        background:
          radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.09), rgba(255, 255, 255, 0) 56%),
          radial-gradient(circle at 50% 58%, rgba(96, 128, 255, 0.12), rgba(96, 128, 255, 0) 62%);
        opacity: 0;
        filter: blur(26px);
        transform: scale(0.88);
        will-change: transform, opacity, filter;
      }

      #site-intro-loader .source-paths {
        display: none;
      }

      #site-intro-loader .shape-fill path {
        fill: #ffffff;
        stroke: none;
      }

      #site-intro-loader .glow-back,
      #site-intro-loader .glow-mid,
      #site-intro-loader .glow-front,
      #site-intro-loader .glow-core {
        transform-box: fill-box;
        transform-origin: center center;
        will-change: transform, opacity, filter;
      }

      #site-intro-loader .glow-back path,
      #site-intro-loader .glow-mid path,
      #site-intro-loader .glow-front path,
      #site-intro-loader .glow-core path {
        stroke: none;
      }

      #site-intro-loader .glow-back {
        opacity: 0;
        filter: blur(42px);
      }

      #site-intro-loader .glow-back path {
        fill: var(--glow-deep);
      }

      #site-intro-loader .glow-mid {
        opacity: 0;
        filter: blur(28px);
      }

      #site-intro-loader .glow-mid path {
        fill: var(--glow-cool);
      }

      #site-intro-loader .glow-front {
        opacity: 0;
        filter: blur(16px);
      }

      #site-intro-loader .glow-front path {
        fill: var(--glow-silver);
      }

      #site-intro-loader .glow-core {
        opacity: 0;
        filter: blur(6px);
      }

      #site-intro-loader .glow-core path {
        fill: var(--glow-white);
      }

      #site-intro-loader .ambient-glow {
        opacity: 0;
        transform-origin: center center;
        will-change: opacity, transform, filter;
      }

      #site-intro-loader .sheen {
        opacity: 0;
        transform-origin: center center;
        will-change: opacity, transform;
        mix-blend-mode: screen;
      }

      @media (max-width: 768px) {
        #site-intro-loader svg {
          width: min(290px, 64vw);
        }

        #site-intro-loader .intro-mark {
          width: min(360px, 82vw);
        }

        #site-intro-loader .glow-back {
          filter: blur(34px);
        }

        #site-intro-loader .glow-mid {
          filter: blur(22px);
        }

        #site-intro-loader .glow-front {
          filter: blur(12px);
        }

        #site-intro-loader .glow-core {
          filter: blur(5px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #site-intro-loader {
          transition: opacity 0.35s ease;
        }
      }
    </style>
  </head>

  <body data-sveltekit-preload-data="hover">
    <div id="site-intro-loader" aria-hidden="true">
      <div class="intro-mark" id="intro-mark">
        <div class="intro-mark-glow" id="intro-mark-glow"></div>
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 969 969"
          focusable="false"
          id="intro-mark-svg"
        >
          <defs>
            <radialGradient id="ambientGradient" cx="50%" cy="50%" r="50%">
              <stop offset="0%" stop-color="rgba(255,255,255,0.18)"></stop>
              <stop offset="30%" stop-color="rgba(197,214,255,0.12)"></stop>
              <stop offset="58%" stop-color="rgba(120,155,255,0.06)"></stop>
              <stop offset="100%" stop-color="rgba(0,0,0,0)"></stop>
            </radialGradient>
            <linearGradient id="sheenGradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="rgba(255,255,255,0)"></stop>
              <stop offset="46%" stop-color="rgba(255,255,255,0)"></stop>
              <stop offset="50%" stop-color="rgba(255,255,255,0.78)"></stop>
              <stop offset="54%" stop-color="rgba(255,255,255,0)"></stop>
              <stop offset="100%" stop-color="rgba(255,255,255,0)"></stop>
            </linearGradient>
            <clipPath id="prismClip">
              <g id="shape-fill-clip"></g>
            </clipPath>
          </defs>

          <g id="ambient-glow-group" class="ambient-glow">
            <ellipse cx="484.5" cy="484.5" rx="245" ry="218" fill="url(#ambientGradient)"></ellipse>
          </g>

          <g id="source-paths" class="source-paths">
            <path d="M175.33,886.39L514.99,37c-34.84,220.59-70.34,441.09-105.93,661.57l-3.59,4.41-230.16,183.41Z"></path>
            <path d="M798,933l-620.99-45,6.07-4.42,222.26-137.39,74.3,37.67c90.86,42.77,182.96,82.91,273.39,126.61l23.97,10.52-1.27-8.22L514.94,55.52l2.07-19.52,280.99,897Z"></path>
          </g>

          <g id="glow-back-group" class="glow-back"></g>
          <g id="glow-mid-group" class="glow-mid"></g>
          <g id="glow-front-group" class="glow-front"></g>
          <g id="glow-core-group" class="glow-core"></g>

          <g id="shape-fill-group" class="shape-fill"></g>

          <g id="sheen-group" class="sheen" clip-path="url(#prismClip)">
            <rect x="-280" y="0" width="220" height="969" fill="url(#sheenGradient)" transform="rotate(18 484.5 484.5)"></rect>
          </g>
        </svg>
      </div>
    </div>

    <div style="display: contents">%sveltekit.body%</div>

    <script>
      (function () {
        const loader = document.getElementById('site-intro-loader');
        if (!loader) return;

        const sourceGroup = loader.querySelector('#source-paths');
        const introMark = loader.querySelector('#intro-mark');
        const introMarkGlow = loader.querySelector('#intro-mark-glow');
        const introMarkSvg = loader.querySelector('#intro-mark-svg');
        const ambientGlow = loader.querySelector('#ambient-glow-group');
        const glowBackGroup = loader.querySelector('#glow-back-group');
        const glowMidGroup = loader.querySelector('#glow-mid-group');
        const glowFrontGroup = loader.querySelector('#glow-front-group');
        const glowCoreGroup = loader.querySelector('#glow-core-group');
        const shapeFillGroup = loader.querySelector('#shape-fill-group');
        const shapeFillClip = loader.querySelector('#shape-fill-clip');
        const sheenGroup = loader.querySelector('#sheen-group');

        const revealDuration = 2100;
        const fadeDuration = 650;
        const minimumVisible = 1350;

        let minDone = false;
        let loadDone = document.readyState === 'complete';

        const sourcePaths = Array.from(sourceGroup.querySelectorAll('path'));

        const makePath = (d, group) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', d);
          group.appendChild(p);
          return p;
        };

        sourcePaths.forEach((path) => {
          const d = path.getAttribute('d');
          if (!d) return;

          makePath(d, glowBackGroup);
          makePath(d, glowMidGroup);
          makePath(d, glowFrontGroup);
          makePath(d, glowCoreGroup);
          makePath(d, shapeFillGroup);
          makePath(d, shapeFillClip);
        });

        const animateLayer = (el, keyframes, options) => {
          if (!el) return;
          el.animate(keyframes, { fill: 'forwards', ...options });
        };

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            animateLayer(
              introMark,
              [
                { opacity: 0, transform: 'translate3d(0, 24px, 0) scale(0.84) rotate(-10deg)', filter: 'blur(16px)' },
                { opacity: 1, transform: 'translate3d(0, 0, 0) scale(1.02) rotate(1.4deg)', filter: 'blur(0px)', offset: 0.64 },
                { opacity: 1, transform: 'translate3d(0, 0, 0) scale(1) rotate(0deg)', filter: 'blur(0px)' }
              ],
              {
                duration: revealDuration,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              introMarkSvg,
              [
                { transform: 'translate3d(0, 12px, 0) scale(0.92)', opacity: 0.4 },
                { transform: 'translate3d(0, -4px, 0) scale(1.01)', opacity: 1, offset: 0.62 },
                { transform: 'translate3d(0, 0, 0) scale(1)', opacity: 1 }
              ],
              {
                duration: revealDuration,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              introMark,
              [
                { boxShadow: '0 0 0 rgba(255,255,255,0)' },
                { boxShadow: '0 0 140px rgba(255,255,255,0.04)', offset: 0.55 },
                { boxShadow: '0 0 84px rgba(255,255,255,0)' }
              ],
              {
                duration: revealDuration,
                easing: 'ease-out'
              }
            );

            animateLayer(
              introMark,
              [
                { opacity: 0 },
                { opacity: 1, offset: 0.18 },
                { opacity: 1 }
              ],
              {
                duration: revealDuration * 0.42,
                easing: 'ease-out'
              }
            );

            animateLayer(
              introMarkGlow,
              [
                { opacity: 0, transform: 'scale(0.78)', filter: 'blur(34px)' },
                { opacity: 0.42, transform: 'scale(1)', filter: 'blur(26px)', offset: 0.5 },
                { opacity: 0.18, transform: 'scale(1.12)', filter: 'blur(32px)' }
              ],
              {
                duration: revealDuration,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              ambientGlow,
              [
                { opacity: 0, transform: 'scale(0.72)' },
                { opacity: 0.42, transform: 'scale(1.02)', offset: 0.55 },
                { opacity: 0.32, transform: 'scale(1.14)' }
              ],
              {
                duration: revealDuration,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              glowBackGroup,
              [
                { opacity: 0, transform: 'scale(0.8)' },
                { opacity: 0.18, transform: 'scale(0.98)', offset: 0.5 },
                { opacity: 0.24, transform: 'scale(1.08)' }
              ],
              {
                duration: revealDuration,
                delay: 20,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              glowMidGroup,
              [
                { opacity: 0, transform: 'scale(0.84)' },
                { opacity: 0.2, transform: 'scale(0.99)', offset: 0.52 },
                { opacity: 0.32, transform: 'scale(1.06)' }
              ],
              {
                duration: revealDuration,
                delay: 50,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              glowFrontGroup,
              [
                { opacity: 0, transform: 'scale(0.88)' },
                { opacity: 0.26, transform: 'scale(0.995)', offset: 0.5 },
                { opacity: 0.36, transform: 'scale(1.04)' }
              ],
              {
                duration: revealDuration,
                delay: 80,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              glowCoreGroup,
              [
                { opacity: 0, transform: 'scale(0.92)' },
                { opacity: 0.14, transform: 'scale(0.985)', offset: 0.46 },
                { opacity: 0.24, transform: 'scale(1.02)' }
              ],
              {
                duration: revealDuration,
                delay: 110,
                easing: 'cubic-bezier(0.16, 1, 0.3, 1)'
              }
            );

            animateLayer(
              sheenGroup,
              [
                { opacity: 0, transform: 'translate3d(-320px, 0, 0)' },
                { opacity: 0, transform: 'translate3d(-320px, 0, 0)', offset: 0.3 },
                { opacity: 0.92, transform: 'translate3d(0, 0, 0)', offset: 0.48 },
                { opacity: 0.28, transform: 'translate3d(220px, 0, 0)', offset: 0.64 },
                { opacity: 0, transform: 'translate3d(420px, 0, 0)' }
              ],
              {
                duration: 1320,
                delay: 420,
                easing: 'cubic-bezier(0.32, 0, 0.12, 1)'
              }
            );

          });
        });

        const maybeHide = () => {
          if (!minDone || !loadDone) return;
          loader.classList.add('is-hidden');
          setTimeout(() => loader.remove(), fadeDuration);
        };

        setTimeout(() => {
          minDone = true;
          maybeHide();
        }, Math.max(revealDuration, minimumVisible));

        if (!loadDone) {
          window.addEventListener(
            'load',
            () => {
              loadDone = true;
              maybeHide();
            },
            { once: true }
          );
        } else {
          maybeHide();
        }
      })();
    </script>
  </body>
</html>
