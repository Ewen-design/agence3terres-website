<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%sveltekit.assets%/images/logo-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    %sveltekit.head%

    <style>
      #site-intro-loader {
        --bg: #000000;

        /* lumière chaude premium */
        --glow-white: rgba(255, 247, 238, 0.9);
        --glow-warm: rgba(255, 220, 170, 0.5);
        --glow-amber: rgba(218, 122, 67, 0.26);
        --glow-deep: rgba(120, 54, 24, 0.12);

        position: fixed;
        inset: 0;
        z-index: 999999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #000;
        opacity: 1;
        transition: opacity 0.65s cubic-bezier(0.22, 0.61, 0.36, 1);
        pointer-events: none;
        overflow: hidden;
      }

      #site-intro-loader.is-hidden {
        opacity: 0;
      }

      #site-intro-loader svg {
        position: relative;
        z-index: 1;
        width: min(500px, 80vw);
        height: auto;
        overflow: visible;
        transform: translateZ(0);
        backface-visibility: hidden;
        isolation: isolate;
      }

      #site-intro-loader .source-paths {
        display: none;
      }

      /* silhouette noire */
      #site-intro-loader .shape-fill path {
        fill: #000;
        stroke: none;
      }

      /*
        GLOW DERRIÈRE LA FORME
        Ce sont des FILLS flous derrière, pas des contours.
      */

      #site-intro-loader .glow-back,
      #site-intro-loader .glow-mid,
      #site-intro-loader .glow-front,
      #site-intro-loader .glow-core {
        transform-box: fill-box;
        transform-origin: center center;
        will-change: transform, opacity, filter;
      }

      #site-intro-loader .glow-back path,
      #site-intro-loader .glow-mid path,
      #site-intro-loader .glow-front path,
      #site-intro-loader .glow-core path {
        stroke: none;
      }

      /* halo très large et très faible */
      #site-intro-loader .glow-back {
        opacity: 0;
        filter: blur(34px);
      }

      #site-intro-loader .glow-back path {
        fill: var(--glow-deep);
      }

      /* halo intermédiaire */
      #site-intro-loader .glow-mid {
        opacity: 0;
        filter: blur(22px);
      }

      #site-intro-loader .glow-mid path {
        fill: var(--glow-amber);
      }

      /* halo proche */
      #site-intro-loader .glow-front {
        opacity: 0;
        filter: blur(12px);
      }

      #site-intro-loader .glow-front path {
        fill: var(--glow-warm);
      }

      /* coeur lumineux le plus proche */
      #site-intro-loader .glow-core {
        opacity: 0;
        filter: blur(6px);
      }

      #site-intro-loader .glow-core path {
        fill: var(--glow-white);
      }

      /* légère ambiance derrière l’ensemble */
      #site-intro-loader .ambient-glow {
        opacity: 0;
        transform-origin: center center;
        will-change: opacity, transform, filter;
      }

      @media (max-width: 768px) {
        #site-intro-loader svg {
          width: min(360px, 82vw);
        }

        #site-intro-loader .glow-back {
          filter: blur(28px);
        }

        #site-intro-loader .glow-mid {
          filter: blur(18px);
        }

        #site-intro-loader .glow-front {
          filter: blur(10px);
        }

        #site-intro-loader .glow-core {
          filter: blur(5px);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        #site-intro-loader {
          transition: opacity 0.35s ease;
        }
      }
    </style>
  </head>

        <g id="glow-back-group" class="glow-back"></g>
        <g id="glow-mid-group" class="glow-mid"></g>
        <g id="glow-front-group" class="glow-front"></g>
        <g id="glow-core-group" class="glow-core"></g>

        <g id="shape-fill-group" class="shape-fill"></g>
      </svg>
    </div>

    <div style="display: contents">%sveltekit.body%</div>

    <script>
      (function () {
        const loader = document.getElementById('site-intro-loader');
        if (!loader) return;

        const sourceGroup = loader.querySelector('#source-paths');
        const ambientGlow = loader.querySelector('#ambient-glow-group');
        const glowBackGroup = loader.querySelector('#glow-back-group');
        const glowMidGroup = loader.querySelector('#glow-mid-group');
        const glowFrontGroup = loader.querySelector('#glow-front-group');
        const glowCoreGroup = loader.querySelector('#glow-core-group');
        const shapeFillGroup = loader.querySelector('#shape-fill-group');

        const revealDuration = 1900;
        const fadeDuration = 650;
        const minimumVisible = 1200;

        let minDone = false;
        let loadDone = document.readyState === 'complete';

        const sourcePaths = Array.from(sourceGroup.querySelectorAll('path'));

        const makePath = (d, group) => {
          const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
          p.setAttribute('d', d);
          group.appendChild(p);
          return p;
        };

        sourcePaths.forEach((path) => {
          const d = path.getAttribute('d');
          if (!d) return;

          makePath(d, glowBackGroup);
          makePath(d, glowMidGroup);
          makePath(d, glowFrontGroup);
          makePath(d, glowCoreGroup);
          makePath(d, shapeFillGroup);
        });

        const animateLayer = (el, keyframes, options) => {
          if (!el) return;
          el.animate(keyframes, { fill: 'forwards', ...options });
        };

        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            animateLayer(
              ambientGlow,
              [
                { opacity: 0, transform: 'scale(0.82)' },
                { opacity: 0.55, transform: 'scale(1.02)', offset: 0.58 },
                { opacity: 0.68, transform: 'scale(1.12)' }
              ],
              {
                duration: revealDuration,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

            animateLayer(
              glowBackGroup,
              [
                { opacity: 0, transform: 'scale(0.9)' },
                { opacity: 0.22, transform: 'scale(1.01)', offset: 0.58 },
                { opacity: 0.34, transform: 'scale(1.1)' }
              ],
              {
                duration: revealDuration,
                delay: 20,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

            animateLayer(
              glowMidGroup,
              [
                { opacity: 0, transform: 'scale(0.92)' },
                { opacity: 0.28, transform: 'scale(1.0)', offset: 0.55 },
                { opacity: 0.42, transform: 'scale(1.08)' }
              ],
              {
                duration: revealDuration,
                delay: 50,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

            animateLayer(
              glowFrontGroup,
              [
                { opacity: 0, transform: 'scale(0.94)' },
                { opacity: 0.32, transform: 'scale(0.995)', offset: 0.52 },
                { opacity: 0.46, transform: 'scale(1.05)' }
              ],
              {
                duration: revealDuration,
                delay: 80,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );

            animateLayer(
              glowCoreGroup,
              [
                { opacity: 0, transform: 'scale(0.96)' },
                { opacity: 0.18, transform: 'scale(0.99)', offset: 0.48 },
                { opacity: 0.3, transform: 'scale(1.03)' }
              ],
              {
                duration: revealDuration,
                delay: 110,
                easing: 'cubic-bezier(0.22, 1, 0.36, 1)'
              }
            );
          });
        });

        const maybeHide = () => {
          if (!minDone || !loadDone) return;
          loader.classList.add('is-hidden');
          setTimeout(() => loader.remove(), fadeDuration);
        };

        setTimeout(() => {
          minDone = true;
          maybeHide();
        }, Math.max(revealDuration, minimumVisible));

        if (!loadDone) {
          window.addEventListener(
            'load',
            () => {
              loadDone = true;
              maybeHide();
            },
            { once: true }
          );
        } else {
          maybeHide();
        }
      })();
    </script>
  </body>
</html>
